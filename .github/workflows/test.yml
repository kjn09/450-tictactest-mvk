name: Run Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew assemble

      - name: Run tests
        run: ./gradlew test

      - name: Run mutation tests
        run: ./gradlew pitest 

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: build/reports

      - name: Run end-to-end tests
        run: ./gradlew e2eTest