plugins {
	id 'java'
	id 'jacoco' 
	id 'info.solidsoft.pitest' version '1.19.0-rc.3'
}

if (version == 'unspecified') {
	version = '0.0.0-dev'
}

jar {
	archiveBaseName = 'tictactest'
	manifest {
		attributes 'Main-Class': 'ch.bbw.m450.tictactoe.TicTacToeMain'
	}
}

repositories {
	mavenCentral()
}

test {
	useJUnitPlatform {
		excludeTags 'e2e'
	}
	finalizedBy jacocoTestReport
}

tasks.register('e2eTest', Test) {
	description = 'Runs the end-to-end tests (tag e2e)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'e2e'
	}
	shouldRunAfter test
}

check {
	dependsOn e2eTest
}

jacocoTestReport { 
	dependsOn test
	finalizedBy jacocoTestCoverageVerification
	reports {
		html.required = true
		xml.required = true
	}
}

jacocoTestCoverageVerification { 
	violationRules {
		rule {
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.90
			}
		}
	}
}

pitest { 
	junit5PluginVersion = '1.2.3'
	targetClasses = ['ch.bbw.m450.tictactoe.*']
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
	excludedGroups = ['e2e']
}

dependencies {
	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.junit-pioneer:junit-pioneer:2.3.0'
	testImplementation 'com.approvaltests:approvaltests:31.0.0'
}